replicaCount: 1

image:
  repository: traverse/router
  tag: 0.1.0
  pullPolicy: IfNotPresent

service:
  port: 8080
  type: ClusterIP

env:
  RUST_LOG: info

# Storage backend. Only "memory" and "file" are implemented: "s3" and
# "postgres" features exist as explicit not-implemented stubs and the binary
# refuses to start with STORAGE=s3. Do not set kind: s3 expecting durability.
storage:
  kind: memory # memory | file
  dir: /data
  s3:
    bucket: ""
    prefix: "traverse"
    region: us-east-1

# Auth: single global token (CONTROL_PLANE_TOKEN) or per-tenant "t1:tok1,t2:tok2" (CONTROL_PLANE_TOKENS)
# WARNING: empty token/token map disables auth (local dev only). /health and
# /metrics stay public by design; put network controls in front if tenant names
# or policy metadata are sensitive.
auth:
  # global admin token (empty = open dev)
  token: ""
  # per-tenant map e.g. "tenant-a:tok-a,tenant-b:tok-b"
  tokens: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false

monitoring:
  enabled: false

otel:
  enabled: false
  endpoint: "http://otel-collector:4317"
  # e.g. honeycomb, jaeger
  headers: ""

billing:
  enabled: false
  # cost per 1k pulls, used for metrics label
  costPer1k: 0.001
