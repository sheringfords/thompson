name: trace-replay

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cargo test --workspace --quiet
      - run: cargo check -p thompson-sampling --examples
      - run: cargo test -p thompson-sampling --test stress --quiet
      - run: cargo run --release -p thompson-sim -- --seeds 50 --csv docs/results.csv
      - run: cat docs/results.csv
      - name: Trace replay (if traces present)
        run: |
          if ls traces/*.jsonl 1>/dev/null 2>&1; then
            cargo run --release -p thompson-sim -- --trace traces/*.jsonl --csv docs/results-trace.csv
            cat docs/results-trace.csv
            # Ledger replay regression test (real test; the old -run
            # TestTraceReplay pattern matched nothing and gated nothing).
            go test ./gateway/ -run 'TestLedgerFromFileGroupsPaired' -v
          else
            echo "no traces, skipping replay"
          fi
