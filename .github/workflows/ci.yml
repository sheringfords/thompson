name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      - name: Doc
        run: cargo doc --workspace --no-deps

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # The statistical tests here are the point of the package, and the
      # concurrency test only means something under the race detector.
      - name: Test
        run: go test -race ./...
      - name: Conformance
        # Protocol-v1 wire fixtures shared with the Rust side
        # (protocol/testdata + TestProtocol* in go/thompson +
        # crates/thompson-sampling/tests/protocol.rs). The -run pattern must
        # match real tests: an empty match exits 0 and gates nothing.
        run: go test -run 'TestProtocol' -v ./...
      - name: Helm lint
        run: |
          helm lint ../helm/traverse || echo "helm not installed, skip"
          helm lint ../helm/router || echo "helm not installed, skip"

  reproduce:
    name: Reproduce findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2

      # A smaller seed count than the published tables: this checks that the
      # harness still runs end to end, not that the numbers match exactly.
      - name: Run harness
        run: cargo run --release -p thompson-sim -- --seeds 5
