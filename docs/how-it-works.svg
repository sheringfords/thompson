<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" aria-label="Thompson adaptive loop: select, persist, execute, verify, learn, with improved policy feeding back">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#59636e"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8250df"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="60" y="20" width="360" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="90" cy="43" r="14" fill="#0969da"/>
    <text x="90" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <text x="264" y="48" text-anchor="middle" font-size="14" fill="#1f2328">Select an execution strategy</text>
    <line x1="240" y1="66" x2="240" y2="94" stroke="#59636e" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="60" y="96" width="360" height="46" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/>
    <circle cx="90" cy="119" r="14" fill="#59636e"/>
    <text x="90" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <text x="264" y="124" text-anchor="middle" font-size="14" fill="#1f2328">Persist the decision and its evidence</text>
    <line x1="240" y1="142" x2="240" y2="170" stroke="#59636e" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="60" y="172" width="360" height="46" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <circle cx="90" cy="195" r="14" fill="#9a6700"/>
    <text x="90" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
    <text x="264" y="200" text-anchor="middle" font-size="14" fill="#1f2328">Execute the selected strategy</text>
    <line x1="240" y1="218" x2="240" y2="246" stroke="#59636e" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="60" y="248" width="360" height="46" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <circle cx="90" cy="271" r="14" fill="#1a7f37"/>
    <text x="90" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
    <text x="264" y="276" text-anchor="middle" font-size="14" fill="#1f2328">Receive an independently verified outcome</text>
    <line x1="240" y1="294" x2="240" y2="322" stroke="#59636e" stroke-width="1.5" marker-end="url(#flow)"/>

    <rect x="60" y="324" width="360" height="46" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
    <circle cx="90" cy="347" r="14" fill="#8250df"/>
    <text x="90" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
    <text x="264" y="352" text-anchor="middle" font-size="14" fill="#1f2328">Persist, settle, and learn</text>

    <path d="M 425 347 C 600 347 600 43 425 43" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#loop)"/>
    <text x="622" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">improved</text>
    <text x="622" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">policy</text>
  </g>
</svg>
